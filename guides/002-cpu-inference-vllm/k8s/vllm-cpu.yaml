# Guide 002 — CPU Inference with vLLM
# Model:   meta-llama/Llama-3.2-1B-Instruct
# Node:    t3.xlarge (Karpenter cpu NodePool)
# Image:   vllm/vllm-openai-cpu  (CPU-specific — NOT the GPU image)
# API:     OpenAI-compatible on port 8000
#
# Changes from initial version:
#   - Use vllm/vllm-openai-cpu:v0.32.0  (vllm/vllm-openai:latest is GPU-only, fails on CPU)
#   - Remove --device cpu flag  (CPU image defaults to CPU, flag is ambiguous in v0.32)
#   - Model passed as positional arg  (new vLLM CLI convention)
#   - Added /dev/shm tmpfs mount 2Gi  (vLLM needs >64MB shm for multi-process; K8s default is 64MB)
#
# Apply:  kubectl apply -f k8s/vllm-cpu.yaml
# Delete: kubectl delete -f k8s/vllm-cpu.yaml
# Logs:   kubectl logs -n llm-serving -l app=vllm-cpu -f

---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving
  labels:
    project: llms-on-eks

---
# StorageClass: gp3
# EKS ships with gp2 as the default StorageClass. gp3 is faster at the same price.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"

---
# Model cache — EBS gp3 PVC
# Weights are downloaded once (~7GB), cached here, reused on pod restart
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  namespace: llm-serving
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources:
    requests:
      storage: 30Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu
  namespace: llm-serving
  labels:
    app: vllm-cpu
    model: llama-3.2-1b
    guide: "002"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-cpu
  template:
    metadata:
      labels:
        app: vllm-cpu
        model: llama-3.2-1b
    spec:
      nodeSelector:
        node-type: cpu
      containers:
        - name: vllm
          # CPU-specific image — vllm/vllm-openai:latest is GPU-only and crashes on CPU nodes
          image: vllm/vllm-openai-cpu:v0.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          args:
            # Positional model arg (new vLLM CLI convention in v0.32)
            - "meta-llama/Llama-3.2-1B-Instruct"
            - "--dtype"
            - "bfloat16"          # BF16 on x86 AVX-512
            - "--max-model-len"
            - "2048"
            - "--max-num-seqs"
            - "4"
            - "--served-model-name"
            - "llama-3.2-1b"
            - "--port"
            - "8000"
            - "--host"
            - "0.0.0.0"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /model-cache
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "4"          # 4GB KV cache — model weights use ~8GB, leaving 4GB on t3.xlarge 16GB node
            - name: OMP_NUM_THREADS
              value: "4"          # Match CPU limit
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
            - name: dshm
              mountPath: /dev/shm  # vLLM shm_broadcast needs >64MB; K8s default is 64MB
          resources:
            requests:
              cpu: "4"
              memory: "14Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            failureThreshold: 60   # 60 × 10s = 10 min startup window
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi        # tmpfs backed by RAM — vLLM needs 160MB minimum

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-cpu
  namespace: llm-serving
  labels:
    app: vllm-cpu
spec:
  type: ClusterIP
  selector:
    app: vllm-cpu
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
